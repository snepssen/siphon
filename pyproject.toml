[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siphon"
version = "0.1.0"
description = "Fetch media from a URL, or convert what you already have. Local, private, and never re-encodes what it does not have to."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "snepssen" }]
keywords = ["download", "convert", "media", "yt-dlp", "ffmpeg", "playlist",
            "transcode", "remux", "offline", "local-first"]
classifiers = [
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Conversion",
  "Topic :: Multimedia :: Video :: Conversion",
]
# Standard library only. yt-dlp and ffmpeg are external programs, located at
# runtime rather than bundled, and their absence is reported as a sentence
# with the install line for the platform.
dependencies = []

[project.scripts]
siphon = "siphon:main"

[project.urls]
Source = "https://github.com/snepssen/siphon"

[tool.setuptools]
py-modules = ["siphon", "jobs", "model", "formats", "library", "paths",
              "credentials", "platform_support"]
packages = ["sources", "engines"]
